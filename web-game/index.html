<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Precision Vault Lock</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #game-container {
            text-align: center;
            position: relative;
        }
        canvas {
            background-color: #16213e;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(15, 52, 96, 0.8);
            margin-bottom: 10px;
        }
        h1 { margin: 0 0 10px 0; font-size: 24px; color: #e94560; }
        p { margin: 5px 0; font-size: 14px; color: #a2a8d3; max-width: 300px; }
        #status { font-size: 20px; font-weight: bold; margin-bottom: 5px; color: #e94560; height: 24px;}
        #timerDisplay { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #f9a826; height: 22px; }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            pointer-events: auto;
            transition: background 0.2s;
        }
        button:hover { background-color: #ff3366; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>Vault Lock</h1>
    <p id="instructions">Tap or click ANYWHERE when the dial is in the green zone to crack the vault. Crack 3 levels before time runs out!</p>
    <div id="status"></div>
    <div id="timerDisplay"></div>
    <canvas id="gameCanvas" width="300" height="300"></canvas>
    <br>
    <button id="actionBtn">Start Game</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const actionBtn = document.getElementById('actionBtn');
    const statusText = document.getElementById('status');
    const timerDisplay = document.getElementById('timerDisplay');
    const instructions = document.getElementById('instructions');

    let isPlaying = false;
    let animationId;
    let level = 1;
    let dialAngle = 0;
    let rotationSpeed = 0.05;
    
    let targetStart = 0;
    let targetSize = Math.PI / 2; 
    const maxLevels = 3;
    
    // Timer variables
    let timeLeft = 5.0; 
    let lastTime = 0;

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 130;

    function initGame() {
        level = 1;
        isPlaying = true;
        actionBtn.style.display = 'none';
        instructions.style.display = 'none';
        setupLevel();
        lastTime = performance.now();
        gameLoop(lastTime);
    }

    function setupLevel() {
        targetStart = Math.random() * (Math.PI * 2);
        targetSize = (Math.PI / 2) * (1 - (level * 0.15)); 
        rotationSpeed = 0.04 + (level * 0.02);
        dialAngle = 0;
        timeLeft = 5.0; // Reset timer for each level
        statusText.innerText = `Level ${level} of ${maxLevels}`;
        statusText.style.color = "#a2a8d3";
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.strokeStyle = '#0f3460';
        ctx.lineWidth = 10;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, targetStart, targetStart + targetSize);
        ctx.strokeStyle = '#4caf50';
        ctx.lineWidth = 15;
        ctx.stroke();

        const dialX = centerX + Math.cos(dialAngle) * radius;
        const dialY = centerY + Math.sin(dialAngle) * radius;
        
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(dialX, dialY);
        ctx.strokeStyle = '#e94560';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(centerX, centerY, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
    }

    function update(timestamp) {
        // Calculate delta time for the countdown
        const deltaTime = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        
        timeLeft -= deltaTime;
        
        if (timeLeft <= 0) {
            timeLeft = 0;
            timerDisplay.innerText = `Time: 0.0s`;
            endGame(false, "Time Out! Too slow.");
            return;
        }

        timerDisplay.innerText = `Time: ${timeLeft.toFixed(1)}s`;

        dialAngle += rotationSpeed;
        if (dialAngle > Math.PI * 2) {
            dialAngle -= Math.PI * 2; 
        }
    }

    function gameLoop(timestamp) {
        if (!isPlaying) return;
        update(timestamp);
        if (isPlaying) { // Check again in case time ran out during update
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }
    }

    function handleInput(e) {
        if (!isPlaying) return;
        if(e) e.preventDefault(); 

        let normalizedDial = dialAngle;
        let hit = false;

        if (targetStart + targetSize > Math.PI * 2) {
            let overflow = (targetStart + targetSize) - (Math.PI * 2);
            if (normalizedDial >= targetStart || normalizedDial <= overflow) {
                hit = true;
            }
        } else {
            if (normalizedDial >= targetStart && normalizedDial <= targetStart + targetSize) {
                hit = true;
            }
        }

        if (hit) {
            level++;
            if (level > maxLevels) {
                endGame(true, "Vault Cracked! You Win!");
            } else {
                setupLevel();
            }
        } else {
            endGame(false, "Lockout! You Missed.");
        }
    }

    function endGame(win, message) {
        isPlaying = false;
        cancelAnimationFrame(animationId);
        draw(); // Draw final state
        
        statusText.innerText = message;
        statusText.style.color = win ? "#4caf50" : "#e94560";
        timerDisplay.innerText = "";
        
        actionBtn.innerText = "Restart Game";
        actionBtn.style.display = 'inline-block';
        instructions.style.display = 'block';
    }

    window.addEventListener('mousedown', (e) => {
        if (e.target.id !== 'actionBtn') handleInput(e);
    });
    window.addEventListener('touchstart', (e) => {
        if (e.target.id !== 'actionBtn') handleInput(e);
    }, { passive: false });

    draw();

    actionBtn.addEventListener('click', (e) => {
        e.stopPropagation(); 
        initGame();
    });
</script>
</body>
</html>
