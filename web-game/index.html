<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Precision Vault Lock - Endless Survival</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
            transition: background-color 0.15s ease; /* Smooth flash transition */
        }
        #game-container {
            text-align: center;
            position: relative;
        }
        canvas {
            background-color: #16213e;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(15, 52, 96, 0.8);
            margin-bottom: 10px;
        }
        h1 { margin: 0 0 10px 0; font-size: 24px; color: #e94560; }
        p { margin: 5px 0; font-size: 14px; color: #a2a8d3; max-width: 300px; }
        #status { font-size: 20px; font-weight: bold; margin-bottom: 5px; color: #e94560; height: 24px;}
        #timerDisplay { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #f9a826; height: 22px; }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            pointer-events: auto;
            transition: background 0.2s;
        }
        button:hover { background-color: #ff3366; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>Vault Lock: Endless</h1>
    <p id="instructions">Tap or click ANYWHERE in the green zone. The dial reverses and gets faster each time. Survive as long as you can!</p>
    <div id="status"></div>
    <div id="timerDisplay"></div>
    <canvas id="gameCanvas" width="300" height="300"></canvas>
    <br>
    <button id="actionBtn">Start Game</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const actionBtn = document.getElementById('actionBtn');
    const statusText = document.getElementById('status');
    const timerDisplay = document.getElementById('timerDisplay');
    const instructions = document.getElementById('instructions');

    let isPlaying = false;
    let animationId;
    let streak = 0; // Replaced "level" with endless streak
    let highestStreak = 0;
    let dialAngle = 0;
    let baseSpeed = 0.05;
    let dialDirection = 1; // 1 for clockwise, -1 for counter-clockwise
    
    let targetStart = 0;
    let targetSize = Math.PI / 2; 
    
    let timeLeft = 5.0; 
    let lastTime = 0;

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 130;

    // Web Audio API setup
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playTone(freq, type, duration) {
        if (!audioCtx) return;
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
    }

    function flashBackground(color) {
        document.body.style.backgroundColor = color;
        setTimeout(() => {
            document.body.style.backgroundColor = '#1a1a2e';
        }, 150);
    }

    function initGame() {
        initAudio();
        streak = 0;
        dialDirection = 1;
        isPlaying = true;
        actionBtn.style.display = 'none';
        instructions.style.display = 'none';
        setupLevel();
        lastTime = performance.now();
        gameLoop(lastTime);
    }

    function setupLevel() {
        targetStart = Math.random() * (Math.PI * 2);
        // Target gets smaller, but never infinitely small (min size 0.3 radians)
        targetSize = Math.max(0.3, (Math.PI / 2) * Math.pow(0.9, streak)); 
        // Speed increases gradually
        baseSpeed = 0.04 + (streak * 0.005); 
        timeLeft = 5.0 - Math.min(3.0, streak * 0.1); // Timer gets tighter up to a cap
        
        statusText.innerText = `Streak: ${streak}`;
        statusText.style.color = "#a2a8d3";
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.strokeStyle = '#0f3460';
        ctx.lineWidth = 10;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, targetStart, targetStart + targetSize);
        ctx.strokeStyle = '#4caf50';
        ctx.lineWidth = 15;
        ctx.stroke();

        const dialX = centerX + Math.cos(dialAngle) * radius;
        const dialY = centerY + Math.sin(dialAngle) * radius;
        
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(dialX, dialY);
        ctx.strokeStyle = '#e94560';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(centerX, centerY, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
    }

    function update(timestamp) {
        const deltaTime = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        timeLeft -= deltaTime;
        
        if (timeLeft <= 0) {
            timeLeft = 0;
            timerDisplay.innerText = `Time: 0.0s`;
            endGame(false, "Time Out!");
            return;
        }

        timerDisplay.innerText = `Time: ${timeLeft.toFixed(1)}s`;

        dialAngle += baseSpeed * dialDirection;
        // Keep angle wrapped correctly for both directions
        if (dialAngle > Math.PI * 2) dialAngle -= Math.PI * 2; 
        if (dialAngle < 0) dialAngle += Math.PI * 2;
    }

    function gameLoop(timestamp) {
        if (!isPlaying) return;
        update(timestamp);
        if (isPlaying) { 
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }
    }

    function handleInput(e) {
        if (!isPlaying) return;
        if(e) e.preventDefault(); 

        let hit = false;
        if (targetStart + targetSize > Math.PI * 2) {
            let overflow = (targetStart + targetSize) - (Math.PI * 2);
            if (dialAngle >= targetStart || dialAngle <= overflow) hit = true;
        } else {
            if (dialAngle >= targetStart && dialAngle <= targetStart + targetSize) hit = true;
        }

        if (hit) {
            streak++;
            if (streak > highestStreak) highestStreak = streak;
            dialDirection *= -1; // Reverse direction
            playTone(880, 'sine', 0.15); // High beep
            flashBackground('#1c4228'); // Green flash
            setupLevel();
        } else {
            endGame(false, "Lockout! You Missed.");
        }
    }

    function endGame(win, message) {
        isPlaying = false;
        cancelAnimationFrame(animationId);
        draw(); 
        
        playTone(150, 'sawtooth', 0.4); // Low buzz on fail
        flashBackground('#521822'); // Red flash
        
        statusText.innerHTML = `${message}<br><span style="font-size:16px; color:#a2a8d3">Highest Streak: ${highestStreak}</span>`;
        statusText.style.color = "#e94560";
        statusText.style.height = "50px";
        timerDisplay.innerText = "";
        
        actionBtn.innerText = "Restart Game";
        actionBtn.style.display = 'inline-block';
        instructions.style.display = 'block';
    }

    window.addEventListener('mousedown', (e) => {
        if (e.target.id !== 'actionBtn') handleInput(e);
    });
    window.addEventListener('touchstart', (e) => {
        if (e.target.id !== 'actionBtn') handleInput(e);
    }, { passive: false });

    draw();

    actionBtn.addEventListener('click', (e) => {
        e.stopPropagation(); 
        initGame();
    });
</script>
</body>
</html>
